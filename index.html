<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Mission du Père Noël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f6c744;--red:#d7263d;--green:#1f8a4c;--txt:#fdf6e3;--card:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--txt);background:radial-gradient(1200px 800px at 50% -10%,#1f5aa0 0,#0b2250 55%,#050f26 100%) fixed;line-height:1.45;overflow-x:hidden}
.fancy,h1,h2,h3{font-family:'Mountains of Christmas',Georgia,serif;letter-spacing:.5px}
canvas#snow,canvas#confetti{position:fixed;inset:0;pointer-events:none}
canvas#snow{z-index:3000}canvas#confetti{z-index:3100}
body.aff canvas{display:none}
#shell{max-width:560px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:1}
body.orga #shell{max-width:none;padding:0 18px 40px}
.garland{height:16px;margin:0 -14px;background:repeating-linear-gradient(90deg,#d7263d 0 18px,#f6c744 18px 36px,#2fb36a 36px 54px,#3d9be9 54px 72px);animation:pulse 2s infinite}
#hdr{position:sticky;top:0;z-index:50;display:none;align-items:center;gap:10px;padding:10px 12px;margin:0 -14px;background:rgba(6,18,42,.9);backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
#hdr.on{display:flex}
.tbadge{display:flex;align-items:center;gap:8px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--c);color:#111;white-space:nowrap}
#chrono{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;text-align:right;line-height:1.1}
#chrono small{display:block;font-size:11px;font-weight:700;color:#ffd7a0}
.ibtn{position:relative;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;border-radius:12px;padding:8px 11px;cursor:pointer}
.bdg{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:none;align-items:center;justify-content:center;padding:0 5px}
.bdg.on{display:flex}
.card{background:var(--card);border:1px solid rgba(246,199,68,.35);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.card h2{margin:0 0 8px;font-size:28px;color:var(--gold)}
.card.ok{border-color:#34d399;background:rgba(52,211,153,.12)}
.card.warn{border-color:#fb923c;background:rgba(251,146,60,.14)}
.card.hl{border:2px solid var(--gold);background:rgba(246,199,68,.1)}
.hero{text-align:center;padding-top:26px}
.hero h1{font-size:44px;line-height:1.05;margin:6px 0 4px;color:#fff;text-shadow:0 0 18px rgba(246,199,68,.5),0 3px 0 #8d0b17}
.center{text-align:center}.big{font-size:56px;line-height:1.1}.bounce{animation:bob 1.1s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.shake{animation:shake .5s}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font:800 18px 'Nunito',sans-serif;color:#fff;background:linear-gradient(#e63a4f,#b0152a);box-shadow:0 5px 0 #7a0c1b,0 10px 20px rgba(0,0,0,.35);cursor:pointer;margin-top:12px;text-decoration:none;text-align:center}
.btn:active{transform:translateY(3px)}
.btn.gold{background:linear-gradient(#ffd965,#e0a912);color:#4a2d00;box-shadow:0 5px 0 #946d00,0 10px 20px rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(#2fb36a,#17703a);box-shadow:0 5px 0 #0e4a26,0 10px 20px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.3);font-size:15px;padding:11px 14px}
.btn.sm{display:inline-block;width:auto;font-size:14px;padding:8px 12px;margin:0;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn[disabled]{opacity:.45}
.quiet{display:block;margin:16px auto 0;background:none;border:0;color:#fff;opacity:.55;font:600 13px 'Nunito',sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
input,textarea,select{width:100%;padding:13px;border-radius:14px;border:2px solid rgba(246,199,68,.5);background:rgba(0,0,0,.28);color:#fff;font-size:18px;font-family:inherit}
select option{color:#000}
textarea{resize:vertical}
label.l{display:block;font-weight:800;margin:12px 0 6px;color:var(--gold)}
.muted{opacity:.75;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dots i.cur{background:#fff;animation:pulse 1.2s infinite}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.lt{width:34px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);border:2px dashed rgba(246,199,68,.5);font-weight:800;font-size:22px;position:relative}
.lt.on{background:#fff6c2;color:#7a0c1b;border-style:solid}
.lt small{position:absolute;bottom:-1px;right:3px;font-size:9px;opacity:.6}
.riddle{font-size:21px;font-style:italic;color:#fff6c2}
.question{font-size:19px;font-weight:700}
.note{background:rgba(0,0,0,.25);padding:8px 12px;border-radius:12px;font-size:15px}
.ambiance{font-style:italic;opacity:.9;margin:8px 0 0}
.locbadge{display:inline-block;background:var(--red);padding:6px 14px;border-radius:999px;font-weight:800;font-size:18px}
.fb{min-height:22px;margin-top:8px;font-weight:800;color:#ffb4a2}
.gl{font-size:26px;color:var(--gold)}
.bigtime{font-size:44px;font-weight:800;margin:6px 0;color:var(--gold);font-variant-numeric:tabular-nums}
.badge{background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#6b7280}.dot.on{background:#34d399;box-shadow:0 0 8px #34d399}
.mem{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:15px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);opacity:0;pointer-events:none;z-index:3200;background:#fff6c2;color:#4a0d0d;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:.35s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#chat{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:200;background:#0b2250;border:2px solid var(--gold);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s;padding:12px 14px 16px;display:flex;flex-direction:column}
#chat.open{transform:none}
#chatList{overflow:auto;min-height:120px;max-height:42vh;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;font-size:15px;background:rgba(255,255,255,.12)}
.bub.me{align-self:flex-end;background:#2b6cb0}
.bub.orga{align-self:flex-start;background:#8d0b17;border:1px solid var(--gold)}
.bub small{display:block;opacity:.7;font-size:11px;margin-bottom:2px}
/* musique */
#musicFab{position:fixed;left:12px;bottom:12px;z-index:3300;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:rgba(6,18,42,.92);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.5)}
/* scanner QR */
#scan{position:fixed;inset:0;z-index:3400;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;color:#fff}
#scan video{width:100%;max-width:520px;max-height:65vh;border-radius:18px;object-fit:cover;border:3px solid var(--gold);background:#111}
#scan p{margin:0;text-align:center;font-weight:700}
#scan .btn{max-width:320px}
/* machine à sous */
.slotwrap{display:flex;justify-content:center;margin:14px 0 6px}
.slot{position:relative;width:280px;background:linear-gradient(#d4162b,#8d0b17);border:6px solid var(--gold);border-radius:30px 30px 20px 20px;padding:12px 12px 16px;box-shadow:0 0 0 4px #7a5a00,0 18px 40px rgba(0,0,0,.5)}
.marquee{font-family:'Mountains of Christmas',cursive;font-size:22px;color:#fff6c2;text-shadow:0 0 12px #ffd965;margin-bottom:8px;animation:pulse 1.2s infinite}
.reels{display:flex;gap:6px;background:#1a1a1a;padding:8px;border-radius:14px;border:4px solid #e5e5e5;box-shadow:inset 0 0 18px #000}
.reel{flex:1;height:96px;overflow:hidden;background:#fffdf3;border-radius:8px;position:relative}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 25%,transparent 75%,rgba(0,0,0,.35));pointer-events:none}
.strip{position:absolute;left:0;right:0;top:0}
.strip div{height:96px;display:flex;align-items:center;justify-content:center;font-size:52px}
.lever{position:absolute;right:-30px;top:60px;width:30px;height:110px;cursor:pointer}
.lever .stick{position:absolute;left:0;top:30px;width:12px;height:60px;background:linear-gradient(90deg,#aaa,#eee,#999);border-radius:6px;transform-origin:top;transition:transform .3s}
.lever .ball{position:absolute;left:-8px;top:0;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa5,#c1121f 60%,#6b0010);transition:transform .3s}
.lever.pull .ball{transform:translateY(62px)}.lever.pull .stick{transform:scaleY(.2)}
.jackpot{margin:14px 0;font-family:'Mountains of Christmas',cursive;font-size:28px;color:#fff;padding:14px;border-radius:16px;background:linear-gradient(var(--c),rgba(0,0,0,.5));border:3px solid var(--gold);animation:pulse 1s 4}
/* orga */
.obar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0}
.obar h1{margin:0;font-size:38px;color:var(--gold)}
.chip{padding:6px 14px;border-radius:999px;font-weight:800;background:#444}
.chip.run{background:#1f8a4c}.chip.end{background:#8d0b17}.chip.lobby{background:#b58900}
#oClock{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{border:0;border-radius:12px;padding:10px 16px;font:800 16px 'Nunito';background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.tabs button.on{background:var(--gold);color:#4a2d00}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tcard{border-radius:18px;padding:14px;background:rgba(255,255,255,.08);border:3px solid var(--c);box-shadow:0 0 18px rgba(0,0,0,.35);font-size:17px}
.tcard h3{margin:0 0 4px;font-size:28px;color:var(--c)}
.pbar{height:16px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#fff);transition:width .6s}
.ocols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
@media(max-width:900px){.ocols{grid-template-columns:1fr}}
.feedrow{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-size:17px}
.oscroll{max-height:42vh;overflow:auto}
.msgrow{padding:8px 10px;border-radius:12px;margin:6px 0;background:rgba(255,255,255,.08);border-left:6px solid var(--c,#888);font-size:17px}
.msgrow.new{background:rgba(246,199,68,.22)}
.compose{display:grid;gap:8px;margin-top:10px}
.compose .row{display:flex;gap:8px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse}.t th,.t td{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.15);text-align:left;vertical-align:top;font-size:15px}
.tablewrap{overflow-x:auto}
pre{white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;font-size:13px}
/* podium */
#pod{position:fixed;inset:0;z-index:2500;background:linear-gradient(#030a1f 0,#0b2250 55%,#1b4f8a 100%);overflow:hidden;display:none;text-align:center;color:#fff}
#pod.on{display:block}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,#fff8c4,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(2px 2px at 240px 150px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 20px,#ffe,transparent);background-size:320px 180px;animation:pulse 3s infinite}
.moon{position:absolute;right:8%;top:6%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde7,#f3e7a1);box-shadow:0 0 60px #fffbd0}
.sleigh{
    position:absolute;
    top:22%;
    left:100%;
    font-size:54px;
    white-space:nowrap;
    animation:fly 16s linear infinite;
}

@keyframes fly{
    from{
        left:110%;
    }
    to{
        left:-30%;
    }
}
.ptree{position:absolute;bottom:60px;height:min(72vh,580px)}
.ptree.l{left:1%}.ptree.r{right:1%}
.ptree svg{height:100%;width:auto}
@media(max-width:700px){.ptree{opacity:.3}}
.bulb{animation:bl 1.4s infinite alternate}
@keyframes bl{from{opacity:.25}to{opacity:1}}
.ground{position:absolute;left:-5%;right:-5%;bottom:-40px;height:150px;background:radial-gradient(ellipse at 50% 0,#fff 0,#e8f1ff 60%,#cfe0f7 100%);border-radius:50% 50% 0 0}
.deco{position:absolute;bottom:6px;left:0;right:0;font-size:36px;letter-spacing:16px;z-index:2}
.ptop{position:relative;padding-top:18px;z-index:3}
.ptop h1{margin:0;font-size:clamp(30px,5vw,64px);color:var(--gold);text-shadow:0 0 20px rgba(246,199,68,.6)}
.ptop p{margin:6px 0 0;font-size:clamp(16px,2.2vw,26px)}
.podwrap{position:absolute;left:50%;transform:translateX(-50%);bottom:80px;display:flex;align-items:flex-end;gap:10px;width:min(760px,94vw);justify-content:center;z-index:3}
.pcol{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(60px);transition:all .9s cubic-bezier(.2,1.4,.4,1)}
.pcol.show{opacity:1;transform:none}
.pteam{font-family:'Mountains of Christmas',cursive;font-size:clamp(18px,3vw,36px);color:#fff;text-shadow:0 2px 6px #000}
.ptime{font-weight:800;font-size:clamp(14px,2vw,22px);color:var(--gold);margin-bottom:6px}
.pblock{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:10px;color:#fff;background:linear-gradient(var(--c),rgba(0,0,0,.4));border:3px solid rgba(255,255,255,.5);height:0;overflow:hidden;transition:height 1.2s cubic-bezier(.2,.9,.3,1)}
.pcol.show .pblock{height:var(--h)}
.pblock b{font-family:'Mountains of Christmas',cursive;font-size:clamp(36px,6vw,80px);line-height:1}
.crown{font-size:clamp(40px,6vw,76px);animation:bob 1.2s infinite alternate}
.spot{position:absolute;bottom:0;left:50%;width:140%;height:140vh;margin-left:-70%;background:conic-gradient(from 160deg at 50% 100%,transparent 0 10deg,rgba(255,240,170,.25) 20deg 40deg,transparent 50deg);pointer-events:none;z-index:-1}
.p4{position:absolute;left:3%;bottom:90px;z-index:3;font-size:clamp(14px,1.8vw,22px);background:rgba(0,0,0,.4);padding:8px 14px;border-radius:12px;display:none}
.pbtns{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:8px}
/* affiches */
body.aff{background:#2a2f45;color:#222}
body.aff #shell{max-width:none;padding:0}
body.aff .garland{display:none}
.apanel{position:sticky;top:0;z-index:20;background:#0b2250;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.apanel input[type=text]{width:420px;max-width:90vw;font-size:15px;padding:8px}
.sheet{position:relative;width:210mm;height:297mm;margin:14px auto;overflow:hidden;background:linear-gradient(#fffaf0,#ffefd0);color:#3b0d0d;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.5);break-after:page;page-break-after:always;font-family:'Nunito',sans-serif}
.sheet::before{content:"";position:absolute;inset:7mm;border:2.5mm double #b3122a;border-radius:8mm;pointer-events:none}
.sheet .gar{position:absolute;left:0;right:0;top:6mm;height:26mm}
.sheet .ph1{position:absolute;left:0;right:0;top:36mm;font-family:'Mountains of Christmas',Georgia,serif;font-size:27pt;color:#b3122a}
.sheet .pnum{position:absolute;left:0;right:0;top:50mm;font-family:'Mountains of Christmas',Georgia,serif;font-size:54pt;color:#1f6b3a;line-height:1}
.sheet .psub{position:absolute;left:20mm;right:20mm;top:74mm;font-size:14pt;font-weight:700}
.sheet .qrbox{position:absolute;left:50%;top:92mm;width:96mm;height:96mm;margin-left:-48mm;padding:4mm;background:#fff;border:2mm solid #b3122a;border-radius:6mm;box-shadow:0 0 0 2mm #f6c744}
.sheet .qrbox svg{width:100%;height:100%;display:block}
.sheet .pnote{position:absolute;left:66mm;right:66mm;top:200mm;font-size:11pt;font-weight:700;color:#7a0c1b}
.sheet .purl{position:absolute;left:66mm;right:66mm;top:236mm;font-size:7.5pt;word-break:break-all;opacity:.7}
.sheet .pname{position:absolute;left:66mm;right:66mm;top:247mm;font-size:8pt;opacity:.55}
.sheet .tl,.sheet .tr{position:absolute;bottom:16mm;height:78mm}
.sheet .tl{left:12mm}.sheet .tr{right:12mm}
.sheet .tl svg,.sheet .tr svg{height:100%;width:auto}
.sheet .pfoot{position:absolute;left:0;right:0;bottom:11mm;font-size:16pt;letter-spacing:4mm}
@page{size:A4;margin:0}
@media print{body.aff{background:#fff}.noprint{display:none!important}.sheet{margin:0;box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

  const clean = o => { if (o && typeof o === 'object') { for (const k of Object.keys(o)) { o[k] = clean(o[k]); if (o[k] === null || o[k] === undefined) delete o[k]; } } return o; };

const penMin = v => Object.keys(v.hints).length * CONFIG.penaliteIndiceMin;

  const rows = Object.keys(CONFIG.equipes).map(id => {

async function register(name) {
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 30); if (!name) return;
  let pl = {}; try { pl = (await DB.get('/players')) || {}; } catch (e) { }
  const dup = Object.entries(pl).find(([k, p]) => p && norm(p.name || '') === norm(name));
  if (dup) { if (confirm('« ' + dup[1].name + ' » est déjà inscrit(e). C\'est bien toi ?\nOK = reprendre, Annuler = choisir un autre nom.')) adopt(dup[0], dup[1]); return; }
  const pid = 'p' + Date.now().toString(36) + rid();
  await W('put', '/players/' + pid, { name, joinedAt: SV, lastSeen: SV });
  ME = { pid, name, team: null, gid: gid(), t0: Date.now() }; LS.set('mn-me', ME);
  screen = 'slot'; viewKey = ''; render();
}
function adopt(pid, p) {
  ME = { pid, name: p.name, team: p.team || null, gid: gid(), t0: Date.now() }; LS.set('mn-me', ME);
  screen = ME.team ? 'game' : 'slot'; viewKey = ''; render();
}
function logout(silent) {
  LS.del('mn-me'); ME = null; screen = 'home'; viewKey = '';
  L = { team: null, run: '0', progress: 0, hints: {}, log: {}, finishedAt: null }; saveL();
  toggleChat(false); render();
}
async function drawTeam() {
  let pl; try { pl = (await DB.get('/players')) || {}; } catch (e) { pl = S.players || {}; }
  const ids = Object.keys(CONFIG.equipes), cnt = {}; ids.forEach(i => cnt[i] = 0);
  Object.entries(pl).forEach(([k, p]) => { if (p && p.team && cnt[p.team] != null && k !== ME.pid) cnt[p.team]++; });
  let cand = ids.filter(i => cnt[i] < CONFIG.equipes[i].taille), w;
  if (cand.length) w = cand.map(i => CONFIG.equipes[i].taille - cnt[i]);
  else { const m = Math.min(...ids.map(i => cnt[i])); cand = ids.filter(i => cnt[i] === m); w = cand.map(() => 1); }
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
  return cand[cand.length - 1];
}

async function checkAnswer(spec0, team, input, isFinal, stepId) {
  const spec = isFinal ? spec0 : ((spec0.parEquipe && spec0.parEquipe[team]) || spec0);
  const codes = [].concat(spec.code || []), hashes = [].concat(spec.hash || []), n = norm(input);
  if (!n) return false;
  if (codes.some(c => norm(c) === n)) return true;
  if (hashes.length) { try { return hashes.includes(await hashAnswer(isFinal ? 'final' : stepId, input)); } catch (e) { toast('⚠️ Ouvrez le site en https pour valider.'); } }
  return false;
}

  if (!$('#tRep').hidden) setHTML($('#repBoard'), JSON.stringify([S.teams, g.podium, g.startedAt]), boardHTML(true));
  if (!$('#tJou').hidden) {
    const arr = Object.entries(S.players).map(([k, p]) => Object.assign({ k }, p)).sort((a, b) => (a.team || 'z').localeCompare(b.team || 'z') || (a.name || '').localeCompare(b.name || '', 'fr'));
    const sig = JSON.stringify(arr.map(p => [p.k, p.name, p.team || '', isOn(p)]));
    const cnt = ids.map(id => CONFIG.equipes[id].symbole + ' ' + arr.filter(p => p.team === id).length + '/' + CONFIG.equipes[id].taille).join(' · ');
    setHTML($('#jList'), sig, '<p><b>' + arr.length + '</b> inscrit(e)s — ' + cnt + ' — sans équipe : ' + arr.filter(p => !p.team).length + '</p><div class="tablewrap"><table class="t"><tr><th>Nom</th><th>Équipe</th><th>État</th><th></th></tr>' +
      arr.map(p => '<tr><td>' + esc(p.name) + '</td><td><select data-mv="' + p.k + '"><option value="">— aucune —</option>' + ids.map(id => '<option value="' + id + '"' + (p.team === id ? ' selected' : '') + '>' + esc(CONFIG.equipes[id].nom) + '</option>').join('') + '</select></td><td>' + (isOn(p) ? '🟢 en ligne' : '⚪ hors ligne') + '</td><td><button class="btn sm ghost" data-del="' + p.k + '">✕</button></td></tr>').join('') + '</table></div>');
  }
}

/* ---------- affiches imprimables ---------- */
function loadScript(urls) {
  return new Promise((res, rej) => { const u = urls.shift(); if (!u) return rej(); const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = () => loadScript(urls).then(res, rej); document.head.appendChild(s); });
}
function qrSVG(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="' + n + '" height="' + n + '" fill="#fff"/><path d="' + d + '" fill="#111"/></svg>';
}
function garlandSVG() {
  let p = 'M0,8', b = ''; const cols = ['#d7263d', '#f6c744', '#2fb36a', '#3d9be9'];
  for (let k = 0; k < 4; k++) {
    const x0 = k * 200; p += ' Q' + (x0 + 100) + ',78 ' + (x0 + 200) + ',8';
    for (let i = 1; i <= 4; i++) { const t = i / 5, x = x0 + 200 * t, y = (1 - t) * (1 - t) * 8 + 2 * (1 - t) * t * 78 + t * t * 8; b += '<rect x="' + (x - 3).toFixed(1) + '" y="' + (y - 2).toFixed(1) + '" width="6" height="8" fill="#555"/><circle cx="' + x.toFixed(1) + '" cy="' + (y + 9).toFixed(1) + '" r="8" fill="' + cols[(k * 4 + i) % 4] + '"/>'; }
  }
  return '<svg viewBox="0 0 800 100" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><path d="' + p + '" fill="none" stroke="#1f6b3a" stroke-width="5"/>' + b + '</svg>';
}
function sheetHTML(s, url, showName) {
  return '<section class="sheet"><div class="gar">' + garlandSVG() + '</div><div class="tl">' + treeSVG(s.id) + '</div><div class="tr">' + treeSVG(s.id + 20) + '</div>' +
    '<div class="ph1">🎄 ' + esc(CONFIG.titre) + ' 🎄</div><div class="pnum">Poste n°' + s.id + '</div>' +
    '<div class="psub">Vous êtes au bon endroit !<br>Scannez le QR code pour découvrir votre énigme.</div><div class="qrbox">' + qrSVG(url) + '</div>' +
    (s.noteAffiche ? '<div class="pnote">' + nl(s.noteAffiche) + '</div>' : '') + '<div class="purl">' + esc(url) + '</div>' +
    (showName ? '<div class="pname">Emplacement : ' + esc(s.lieu) + '</div>' : '') + '<div class="pfoot">🎁⛄🔔❄️🎅❄️🔔⛄🎁</div></section>';
}
function routeSheet() {
  return '<section class="sheet" style="padding:22mm;text-align:left"><h2 style="font-size:26pt;color:#b3122a;margin:0 0 6mm">Fiche organisateur</h2><h3 style="font-size:16pt;color:#1f6b3a">Parcours des équipes</h3>' +
    Object.keys(CONFIG.equipes).map(id => '<p style="font-size:11pt"><b>' + CONFIG.equipes[id].symbole + ' ' + esc(CONFIG.equipes[id].nom) + '</b> : ' + orderOf(id).map(s => s.id + '. ' + esc(s.lieu)).join(' → ') + '</p>').join('') +
    '<h3 style="font-size:16pt;color:#1f6b3a">Affiches à placer</h3><ol style="font-size:11pt">' + CONFIG.etapes.map(s => '<li>Poste n°' + s.id + ' : ' + esc(s.lieu) + '</li>').join('') + '</ol></section>';
}
async function showAffiches() {
  document.body.classList.add('aff');
  $('#view').innerHTML = '<div class="apanel noprint"><b>🖨 Affiches A4</b><label>Adresse du site : <input type="text" id="abase"></label><label><input type="checkbox" id="anames" checked> afficher le nom du lieu</label><button class="btn sm gold" id="aprint">Imprimer / Enregistrer en PDF</button><span style="opacity:.7;font-size:13px">Mise en page : A4, marges « aucune », graphiques d\'arrière-plan activés.</span></div><div id="sheets"></div>';
  $('#abase').value = P.get('base') || (location.origin + location.pathname);
  try { await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js']); }
  catch (e) { $('#sheets').innerHTML = '<p style="color:#fff;padding:20px">Impossible de charger la bibliothèque QR (connexion internet requise).</p>'; return; }
  const draw = () => { const base = $('#abase').value.trim().split('?')[0], nm = $('#anames').checked; $('#sheets').innerHTML = CONFIG.etapes.map(s => sheetHTML(s, base + '?step=' + s.id, nm)).join('') + routeSheet(); };
  $('#abase').oninput = draw; $('#anames').onchange = draw; $('#aprint').onclick = () => print(); draw();
}

/* ---------- démarrage ---------- */
(function boot() {
  document.body.classList.add(MODE === 'orga' ? 'orga' : MODE === 'affiches' ? 'aff' : 'joueur');
  buildShell();
  if (MODE === 'affiches') return showAffiches();
  startSnow();
  initMusic();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(clock, 1000);
  if (MODE === 'orga') { orgaGate(); tick(); setInterval(tick, 2500); return; }
  render(); tick(); setInterval(tick, 5000);
})();
</script>
